<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>Hardwood Basketball</title>
    <meta name="description" content="Build your NBA career or run a franchise from scratch. Draft. Trade. Win a championship." />
    <meta name="theme-color" content="#FF4713" />

    <!-- Open Graph (link previews on Discord, iMessage, Twitter etc.) -->
    <meta property="og:title"       content="Hardwood Basketball" />
    <meta property="og:description" content="Career mode. GM mode. 82-game seasons. Full draft. Real stats." />
    <meta property="og:type"        content="website" />
    <meta property="og:image"       content="/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Hardwood Basketball" />
    <meta name="twitter:description" content="Career mode. GM mode. 82-game seasons. Full draft. Real stats." />

    <!-- Favicon — vector basketball (circle + seam lines), not an emoji glyph, so it renders consistently across browsers/platforms regardless of emoji font support -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23E8730C'/><path d='M50 4 V96 M4 50 H96' stroke='black' stroke-width='5' fill='none'/><path d='M14 22 Q46 50 14 78' stroke='black' stroke-width='5' fill='none'/><path d='M86 22 Q54 50 86 78' stroke='black' stroke-width='5' fill='none'/></svg>" />

    <!-- Google Fonts — preconnect for speed, then load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Space+Mono:wght@400;700&family=Karla:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
