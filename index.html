<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>Hardwood Basketball — Free Basketball GM Sim &amp; NBA Career Game</title>
    <meta name="description" content="Hardwood is a free browser basketball sim: play a full NBA-style career from rookie to legend, or run your own team as GM — draft, trade, manage the cap, and chase a title across real 82-game seasons. No download, no account, no ads." />
    <meta name="theme-color" content="#FF4713" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="https://www.playhardwood.com/" />

    <!-- Open Graph (link previews on Discord, iMessage, Twitter etc.) -->
    <meta property="og:title"       content="Hardwood Basketball — Free Basketball GM Sim & Career Game" />
    <meta property="og:description" content="Play a full basketball career or run your own team as GM, free in your browser. Draft, trade, manage the cap, and chase a title over real 82-game seasons." />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.playhardwood.com/" />
    <meta property="og:image"       content="https://www.playhardwood.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Hardwood Basketball — Free Basketball GM Sim & Career Game" />
    <meta name="twitter:description" content="Play a full basketball career or run your own team as GM, free in your browser. Draft, trade, manage the cap, and chase a title over real 82-game seasons." />
    <meta name="twitter:image"       content="https://www.playhardwood.com/og-image.png" />

    <!-- Favicon — real files so search engines (Google's favicon crawler in particular doesn't
         reliably resolve inline data-URI icons) can fetch and index the actual basketball icon
         instead of falling back to a generic/default one. SVG kept first for crisp modern browsers,
         ICO/PNG as universally-supported fallbacks. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- use-credentials: on password-protected Vercel preview links the manifest request
         carries the login cookie instead of bouncing to vercel.com/sso-api (a CORS error) -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />

    <!-- The game uses the device's system font. Only the HARDWOOD wordmark font is bundled
         (public/fonts) so it works offline and in the iOS build. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!-- Boot splash: plain HTML/CSS so it paints instantly, before the JS
         bundle downloads. React's createRoot replaces it on first render, so
         it never adds a delay — it only covers the time the app is loading.
         Laid out to line up with the iOS launch image (assets/splash.png), so
         the native launch screen hands off to it without a visible jump. -->
    <style>
      #hw-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
        background:#F3E9DB radial-gradient(ellipse 130% 60% at 50% 48%,#FBF3E7,#F3E9DB 70%,#EBDCC6);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#2C1608}
      #hw-splash .ball{width:96px;height:96px;animation:hw-bounce 1.1s ease-in-out infinite;filter:drop-shadow(0 14px 18px rgba(100,40,0,.35))}
      #hw-splash .word{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:900;font-size:44px;letter-spacing:-1px;line-height:1}
      #hw-splash .tag{font-size:10px;letter-spacing:5px;font-weight:700;opacity:.7}
      #hw-splash .bar{position:absolute;top:calc(50% + 116px);left:50%;margin-left:-70px;width:140px;height:3px;border-radius:3px;background:rgba(44,22,8,.12);overflow:hidden}
      #hw-splash .bar i{display:block;height:100%;width:40%;background:#E8730C;border-radius:3px;animation:hw-load 1.1s ease-in-out infinite}
      @keyframes hw-bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}90%{transform:translateY(1px) scale(1.04,.96)}}
      @keyframes hw-load{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#hw-splash .ball,#hw-splash .bar i{animation:none}}
    </style>
    <div id="root">
      <div id="hw-splash" role="status" aria-label="Loading Hardwood">
        <img class="ball" src="/favicon.svg" alt="" width="96" height="96" />
        <div class="word">HARDWOOD</div>
        <div class="tag">BASKETBALL SIMULATOR</div>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <noscript><p style="font-family:system-ui;text-align:center;padding:40px">Hardwood needs JavaScript turned on to run.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
